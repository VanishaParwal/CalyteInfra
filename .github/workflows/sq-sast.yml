name: Accuknox SAST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  accuknox-cicd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: "Run Accuknox SAST: Opengrep"
        uses: VanishaParwal/sast-scan-opengrep-action@main
        with:
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_label: ${{ secrets.ACCUKNOX_LABEL }}
          anthropic_api_key: "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"
          accuknox_ai_analysis: "false"
          severity : "High"
          soft_fail: "false"
