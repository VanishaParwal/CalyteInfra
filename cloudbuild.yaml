steps:

# Step 1: Pull Sample Image
- name: 'gcr.io/cloud-builders/docker'
  id: 'pull-image'
  args:
    - 'pull'
    - 'nginx:latest'

# Step 2: Run AccuKnox Container Scan
- name: 'accuknox/accuknox-container-scan'
  id: 'accuknox-container-scan'
  args:
    - 'image'
    - '--format'
    - 'json'
    - '--output'
    - '/workspace/accuknox-report.json'
    - 'nginx:latest'

# Step 3: Upload Report to GCS
- name: 'gcr.io/cloud-builders/gsutil'
  id: 'upload-report'
  args:
    - 'cp'
    - '/workspace/accuknox-report.json'
    - 'gs://artifacts.shaped-infusion-402417.appspot.com/security-reports/accuknox-report.json'
  waitFor:
    - 'accuknox-container-scan'

# Step 4: Print Report
- name: 'ubuntu'
  id: 'print-report'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      cat /workspace/accuknox-report.json
  waitFor:
    - 'accuknox-container-scan'

# Step 5: Read AccuKnox Token Secret
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'access-token-secret'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud secrets versions access latest \
      --secret=accuknox_token \
      --format='get(payload.data)' | tr '_-' '/+' | base64 -d > /workspace/accuknox-token.txt

# Step 6: Read AccuKnox Endpoint Secret
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'access-endpoint-secret'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud secrets versions access latest \
      --secret=accuknox_endpoint \
      --format='get(payload.data)' | tr '_-' '/+' | base64 -d > /workspace/accuknox-endpoint.txt

# Step 7: Read AccuKnox Label Secret
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'access-label-secret'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud secrets versions access latest \
      --secret=accuknox_label \
      --format='get(payload.data)' | tr '_-' '/+' | base64 -d > /workspace/accuknox-label.txt

# Step 8: Upload Scan Result to AccuKnox SaaS
- name: 'gcr.io/cloud-builders/curl'
  id: 'forward-result-to-accuknox'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      TOKEN=$(cat /workspace/accuknox-token.txt)
      ENDPOINT=$(cat /workspace/accuknox-endpoint.txt)
      LABEL=$(cat /workspace/accuknox-label.txt)

      curl --location --request POST \
      "https://${ENDPOINT}/api/v1/artifact/?label=${LABEL}&data_type=TR&save_to_s3=false" \
      --header "Authorization: Bearer ${TOKEN}" \
      --form "file=@/workspace/accuknox-report.json"
  waitFor:
    - 'access-token-secret'
    - 'access-endpoint-secret'
    - 'access-label-secret'
    - 'accuknox-container-scan'

# Step 9: Fail Pipeline on Critical Vulnerabilities
- name: 'ubuntu'
  id: 'policy-check'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      if grep -q "CRITICAL" /workspace/accuknox-report.json; then
        echo "CRITICAL vulnerabilities detected."
        echo "Deployment halted."
        exit 1
      else
        echo "No CRITICAL vulnerabilities found."
      fi
  waitFor:
    - 'forward-result-to-accuknox'

options:
  logging: CLOUD_LOGGING_ONLY
