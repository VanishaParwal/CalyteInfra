steps:
  # Step 1: Clone the GitHub repository
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        git clone https://github.com/{user-name}/{repo-name}.git /workspace/AccuKnox_Iac

  # Step 2: Fetch secrets from GCP Secret Manager
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest --secret=ACCUKNOX_TOKEN \
          --format='get(payload.data)' | tr '_-' '/+' | base64 -d \
          > /workspace/accuknox_token.txt

        gcloud secrets versions access latest --secret=ACCUKNOX_LABEL \
          --format='get(payload.data)' | tr '_-' '/+' | base64 -d \
          > /workspace/accuknox_label.txt

        gcloud secrets versions access latest --secret=ACCUKNOX_ENDPOINT \
          --format='get(payload.data)' | tr '_-' '/+' | base64 -d \
          > /workspace/accuknox_endpoint.txt

  # Step 3: Download accuknox-aspm-scanner, run IaC scan and upload to AccuKnox SaaS
  - name: 'ubuntu'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Load secrets from files written in Step 2
        ACCUKNOX_TOKEN=$(cat /workspace/accuknox_token.txt)
        ACCUKNOX_LABEL=$(cat /workspace/accuknox_label.txt)
        ACCUKNOX_ENDPOINT=$(cat /workspace/accuknox_endpoint.txt)

        # Validate that all required secrets are present
        if [ -z "$ACCUKNOX_TOKEN" ] || [ -z "$ACCUKNOX_LABEL" ] || [ -z "$ACCUKNOX_ENDPOINT" ]; then
          echo "ERROR: ACCUKNOX_TOKEN, ACCUKNOX_LABEL, and ACCUKNOX_ENDPOINT must be set!"
          exit 1
        fi

        # Install curl if not present
        apt-get update -qq && apt-get install -y -qq curl

        # Download the AccuKnox ASPM Scanner CLI
        echo "Downloading AccuKnox ASPM Scanner..."
        curl -L https://github.com/accuknox/aspm-scanner-cli/releases/download/v0.13.4/accuknox-aspm-scanner \
          -o /workspace/accuknox-aspm-scanner
        chmod +x /workspace/accuknox-aspm-scanner

        # Build optional scan arguments
        CMD_ARGS=""
        [ -n "${_FILE}" ]      && CMD_ARGS="$CMD_ARGS --file ${_FILE}"
        [ -n "${_DIRECTORY}" ] && CMD_ARGS="$CMD_ARGS --directory ${_DIRECTORY}"
        [ "${_COMPACT}" = "true" ] && CMD_ARGS="$CMD_ARGS --compact"
        [ "${_QUIET}"   = "true" ] && CMD_ARGS="$CMD_ARGS --quiet"
        [ -n "${_FRAMEWORK}" ] && CMD_ARGS="$CMD_ARGS --framework ${_FRAMEWORK}"

        SOFT_FAIL_ARG=""
        [ "${_SOFT_FAIL}" = "true" ] && SOFT_FAIL_ARG="--softfail"

        # Run the IaC scan — scanner handles upload to AccuKnox SaaS internally
        echo "Running AccuKnox IaC scan..."
        /workspace/accuknox-aspm-scanner scan $SOFT_FAIL_ARG iac \
          --command "$CMD_ARGS" \
          --container-mode \
          --repo-url   "https://github.com/{user-name}/{repo-name}.git" \
          --repo-branch "${_BRANCH}" \
          --endpoint "$ACCUKNOX_ENDPOINT" \
          --label    "$ACCUKNOX_LABEL" \
          --token    "$ACCUKNOX_TOKEN"

# Store build logs
logsBucket: 'gs://{bucket-name}'

# Substitutions — safe defaults, override per trigger/manual run as needed
substitutions:
  _DIRECTORY: '/workspace/AccuKnox_Iac'   # Directory to scan (maps to --directory)
  _FILE: ''                                # Specific file to scan (maps to --file); leave empty to scan directory
  _COMPACT: 'true'                         # Suppress code blocks in output
  _QUIET: 'true'                           # Show only failed checks
  _SOFT_FAIL: 'false'                      # Set true to avoid non-zero exit on findings
  _FRAMEWORK: ''                           # e.g. terraform, kubernetes — leave empty for all
  _BRANCH: 'main'                          # Repository branch being scanned

timeout: '1200s'  # 20 minutes
