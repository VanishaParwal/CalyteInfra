steps:

# Step 1: Clone GitHub Repository
- name: 'gcr.io/cloud-builders/git'
  id: 'clone-repository'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      git clone https://github.com/VanishaParwal/CalyteInfra.git /workspace/AccuKnox_Iac

# Step 2: Run Checkov IaC Scan
- name: 'python:3.11'
  id: 'run-checkov-scan'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      pip install checkov

      checkov -d /workspace/AccuKnox_Iac \
      --output json > /workspace/checkov_report.json || true

      echo "===== Checkov Report Generated ====="

      ls -lah /workspace/

# Step 3: Read AccuKnox Token Secret
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'access-token-secret'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud secrets versions access latest \
      --secret=accuknox_token \
      > /workspace/accuknox-token.txt

# Step 4: Read AccuKnox Endpoint Secret
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'access-endpoint-secret'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud secrets versions access latest \
      --secret=accuknox_endpoint \
      > /workspace/accuknox-endpoint.txt

# Step 5: Read AccuKnox Label Secret
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'access-label-secret'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud secrets versions access latest \
      --secret=accuknox_label \
      > /workspace/accuknox-label.txt

# Step 6: Enrich Report
- name: 'ubuntu'
  id: 'enrich-report'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      apt-get update

      apt-get install -y jq

      jq --arg repoLink "https://github.com/VanishaParwal/CalyteInfra.git" \
         --arg branch "main" \
         '. += [{"details": {"repo": $repoLink, "branch": $branch}}]' \
         /workspace/checkov_report.json \
         > /workspace/tmp.json

      mv /workspace/tmp.json /workspace/checkov_report.json

      echo "===== Enriched Report ====="

      cat /workspace/checkov_report.json

# Step 7: Upload report to AccuKnox SaaS
- name: 'gcr.io/cloud-builders/curl'
  id: 'upload-to-accuknox-saas'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      TOKEN=$$(cat /workspace/accuknox-token.txt | tr -d '\n')
      ENDPOINT=$$(cat /workspace/accuknox-endpoint.txt | tr -d '\n')
      LABEL=$$(cat /workspace/accuknox-label.txt | tr -d '\n')

      echo "Uploading IaC report to AccuKnox SaaS..."

      curl -v --location --request POST \
      "https://$${ENDPOINT}/api/v1/artifact/?label=$${LABEL}&data_type=IAC&save_to_s3=false" \
      --header "Authorization: Bearer $${TOKEN}" \
      --header "Content-Type: multipart/form-data" \
      --form "file=@/workspace/checkov_report.json"
  waitFor:
    - 'access-token-secret'
    - 'access-endpoint-secret'
    - 'access-label-secret'
    - 'run-checkov-scan'
    - 'enrich-report'

# Step 8: Upload report to GCS
- name: 'gcr.io/cloud-builders/gsutil'
  id: 'upload-report-to-gcs'
  args:
    - 'cp'
    - '/workspace/checkov_report.json'
    - 'gs://artifacts.shaped-infusion-402417.appspot.com/checkov-reports/checkov_report.json'
  waitFor:
    - 'upload-to-accuknox-saas'

timeout: '1200s'

logsBucket: 'gs://artifacts.shaped-infusion-402417.appspot.com'

options:
  logging: GCS_ONLY
