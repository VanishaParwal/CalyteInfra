steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build'
    args:
      [
        'build',
        '-t',
        '${_IMAGE_URL}:${_IMAGE_TAG}',
        '-f',
        '${_DOCKERFILE_CONTEXT}',
        '.'
      ]

  # Step 2: Download AccuKnox scanner
  - name: 'ubuntu'
    id: 'download-scanner'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y curl

        curl -L https://github.com/accuknox/aspm-scanner-cli/releases/download/v0.14.0/accuknox-aspm-scanner \
          -o /workspace/accuknox-aspm-scanner

        chmod +x /workspace/accuknox-aspm-scanner

        /workspace/accuknox-aspm-scanner tool install --type container

  # Step 3: Fetch secrets from Secret Manager
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'fetch-secrets'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest --secret=accuknox_token \
          --format='get(payload.data)' | tr '_-' '/+' | base64 -d > /workspace/token.txt

        gcloud secrets versions access latest --secret=accuknox_endpoint \
          --format='get(payload.data)' | tr '_-' '/+' | base64 -d > /workspace/endpoint.txt

        gcloud secrets versions access latest --secret=accuknox_label \
          --format='get(payload.data)' | tr '_-' '/+' | base64 -d > /workspace/label.txt

  # Step 4: Run AccuKnox scan (matches your GitHub action logic)
  - name: 'ubuntu'
    id: 'accuknox-scan'
    entrypoint: 'bash'
    env:
      - 'IMAGE_NAME=${_IMAGE_URL}'
      - 'TAG=${_IMAGE_TAG}'
      - 'SEVERITY=${_SEVERITY}'
      - 'SOFT_FAIL=${_SOFT_FAIL}'
      - 'GENERATE_SBOM=${_GENERATE_SBOM}'
      - 'PROJECT_NAME=${_PROJECT_NAME}'
    args:
      - '-c'
      - |
        set -e

        chmod +x /workspace/accuknox-aspm-scanner

        export ACCUKNOX_TOKEN=$(cat /workspace/token.txt)
        export ACCUKNOX_ENDPOINT=$(cat /workspace/endpoint.txt)
        export ACCUKNOX_LABEL=$(cat /workspace/label.txt)

        touch /workspace/results.json
        chmod 666 /workspace/results.json

        # Normalize inputs
        SOFT_FAIL=$(echo "$SOFT_FAIL" | tr '[:upper:]' '[:lower:]' | xargs)
        GENERATE_SBOM=$(echo "$GENERATE_SBOM" | tr '[:upper:]' '[:lower:]' | xargs)

        SOFT_FAIL_ARG=""
        if [ "$SOFT_FAIL" = "true" ]; then
          SOFT_FAIL_ARG="--softfail"
        fi

        CMD="image ${IMAGE_NAME}:${TAG}"

        if [ -n "$SEVERITY" ]; then
          CMD="$CMD --severity $SEVERITY"
        fi

        echo "Running AccuKnox scan: $CMD"

        /workspace/accuknox-aspm-scanner scan \
          $SOFT_FAIL_ARG \
          --keep-results \
          container \
          --command "$CMD" \
          --container-mode

        cp results.json /workspace/results-vuln.json

        # SBOM disabled for now (as requested)
        if [ "$GENERATE_SBOM" = "true" ]; then
          echo "SBOM enabled but not configured yet"
        fi

    waitFor:
      - 'docker-build'
      - 'download-scanner'
      - 'fetch-secrets'

  # Step 5: Upload results to GCS
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'upload-results'
    args:
      [
        'cp',
        '/workspace/results-vuln.json',
        'gs://${_GCS_BUCKET}/'
      ]
    waitFor:
      - 'accuknox-scan'

  # Step 6: Fail build on CRITICAL
  - name: 'ubuntu'
    id: 'security-gate'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if grep -q "CRITICAL" /workspace/results-vuln.json; then
          echo "CRITICAL vulnerabilities found - failing build"
          exit 1
        fi

    waitFor:
      - 'accuknox-scan'

substitutions:
  _IMAGE_URL: 'nginx'
  _IMAGE_TAG: 'latest'
  _DOCKERFILE_CONTEXT: 'Dockerfile'

  _SEVERITY: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
  _SOFT_FAIL: 'false'
  _GENERATE_SBOM: 'false'
  _PROJECT_NAME: ''

  _GCS_BUCKET: 'artifacts.shaped-infusion-402417.appspot.com'

options:
  logging: CLOUD_LOGGING_ONLY
