steps:

# Step 1: Pull NGINX Image
- name: 'gcr.io/cloud-builders/docker'
  id: 'pull-image'
  args:
    - 'pull'
    - 'nginx:latest'

# Step 2: Tag Image for Local Scan
- name: 'gcr.io/cloud-builders/docker'
  id: 'tag-image'
  args:
    - 'tag'
    - 'nginx:latest'
    - 'gcr.io/shaped-infusion-402417/nginx:latest'

# Step 3: Download AccuKnox ASPM Scanner
- name: 'ubuntu'
  id: 'download-scanner'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      apt-get update && apt-get install -y curl
      curl -L https://github.com/accuknox/aspm-scanner-cli/releases/download/v0.14.0/accuknox-aspm-scanner -o /workspace/accuknox-aspm-scanner
      chmod +x /workspace/accuknox-aspm-scanner

# Step 4: Install Container Scanner
- name: 'ubuntu'
  id: 'install-container-tool'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      /workspace/accuknox-aspm-scanner tool install --type container
  waitFor:
    - 'download-scanner'

# Step 5: Access AccuKnox Token from Secret Manager
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'access-secret'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud secrets versions access latest \
      --secret=${_SECRET_NAME} \
      --format='get(payload.data)' | tr '_-' '/+' | base64 -d > /workspace/accuknox-token.txt

# Step 6: Run Vulnerability Scan
- name: 'ubuntu'
  id: 'accuknox-container-scan'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      export ACCUKNOX_TOKEN=$(cat /workspace/accuknox-token.txt)

      /workspace/accuknox-aspm-scanner scan \
        --softfail \
        --keep-results \
        container \
        --command "image gcr.io/shaped-infusion-402417/nginx:latest --severity HIGH,CRITICAL" \
        --container-mode

      cp results.json /workspace/results-vuln.json
  waitFor:
    - 'install-container-tool'
    - 'access-secret'

# Step 7: Upload Results to GCS
- name: 'gcr.io/cloud-builders/gsutil'
  id: 'upload-to-gcs'
  args:
    - 'cp'
    - '/workspace/results-vuln.json'
    - 'gs://artifacts.shaped-infusion-402417.appspot.com/security-reports/results-vuln.json'
  waitFor:
    - 'accuknox-container-scan'

# Step 8: Print Scan Results
- name: 'ubuntu'
  id: 'print-results'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      cat /workspace/results-vuln.json
  waitFor:
    - 'upload-to-gcs'

# Step 9: Block Deployment on Critical Vulnerabilities
- name: 'ubuntu'
  id: 'policy-check'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      if grep -q '"severity":"CRITICAL"' /workspace/results-vuln.json; then
        echo "CRITICAL vulnerabilities detected."
        exit 1
      else
        echo "No critical vulnerabilities found."
      fi
  waitFor:
    - 'print-results'

substitutions:
  _SECRET_NAME: 'accuknox_token'

options:
  logging: CLOUD_LOGGING_ONLY
