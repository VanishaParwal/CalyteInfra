steps:

  # =========================
  # 1. Build Docker Image
  # =========================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      [
        'build',
        '-t',
        'us-central1-docker.pkg.dev/shaped-infusion-402417/app-repo/my-app:latest',
        '.'
      ]

  # =========================
  # 2. Install AccuKnox Scanner
  # =========================
  - name: 'ubuntu'
    id: 'scanner-install'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        apt-get update && apt-get install -y curl

        curl -L https://github.com/accuknox/aspm-scanner-cli/releases/download/v0.14.0/accuknox-aspm-scanner \
          -o /workspace/scanner

        chmod +x /workspace/scanner
        /workspace/scanner tool install --type container

  # =========================
  # 3. Fetch Secrets
  # =========================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'secrets'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        gcloud secrets versions access latest --secret=accuknox_token > /workspace/token.txt
        gcloud secrets versions access latest --secret=accuknox_endpoint > /workspace/endpoint.txt
        gcloud secrets versions access latest --secret=accuknox_label > /workspace/label.txt

  # =========================
  # 4. Scan Image
  # =========================
  - name: 'ubuntu'
    id: 'scan'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        IMAGE="us-central1-docker.pkg.dev/shaped-infusion-402417/app-repo/my-app:latest"

        echo "Scanning $IMAGE"

        /workspace/scanner scan \
          container \
          --command "image $IMAGE --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL" \
          --container-mode \
          --keep-results

        cp results.json /workspace/results.json

  # =========================
  # 5. Upload to AccuKnox SaaS (FIXED)
  # =========================
  - name: 'ubuntu'
    id: 'upload-accuknox'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        TOKEN=$(cat /workspace/token.txt)
        ENDPOINT=$(cat /workspace/endpoint.txt)
        LABEL=$(cat /workspace/label.txt)

        echo "Uploading results to AccuKnox SaaS..."

        curl --location --request POST "$ENDPOINT/api/v1/artifact/" \
          --header "Authorization: Bearer $TOKEN" \
          --header "Label: $LABEL" \
          --form "file=@/workspace/results.json"

  # =========================
  # 6. Security Gate
  # =========================
  - name: 'ubuntu'
    id: 'gate'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if grep -q "CRITICAL" /workspace/results.json; then
          echo "❌ CRITICAL vulnerabilities found - blocking build"
          exit 1
        fi

options:
  logging: CLOUD_LOGGING_ONLY
