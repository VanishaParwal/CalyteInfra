steps:

  # =========================
  # 1. Build Docker Image
  # =========================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      [
        'build',
        '-t',
        'us-central1-docker.pkg.dev/shaped-infusion-402417/app-repo/my-app:latest',
        '.'
      ]

  # =========================
  # 2. Install Scanner
  # =========================
  - name: 'ubuntu'
    id: 'scanner-install'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y curl

        curl -L https://github.com/accuknox/aspm-scanner-cli/releases/download/v0.14.0/accuknox-aspm-scanner \
          -o scanner

        chmod +x scanner
        ./scanner tool install --type container

  # =========================
  # 3. Fetch Secrets
  # =========================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'secrets'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest --secret=accuknox_token > token.txt
        gcloud secrets versions access latest --secret=accuknox_endpoint > endpoint.txt
        gcloud secrets versions access latest --secret=accuknox_label > label.txt

  # =========================
  # 4. Scan Image
  # =========================
  - name: 'ubuntu'
    id: 'scan'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        export accuknox_token=$(cat token.txt)
        export accuknox_endpoint=$(cat endpoint.txt)
        export accuknox_label=$(cat label.txt)

        IMAGE="us-central1-docker.pkg.dev/shaped-infusion-402417/app-repo/my-app:latest"

        echo "Scanning $IMAGE"

        ./scanner scan \
          container \
          --command "image $IMAGE --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL" \
          --container-mode \
          --keep-results

        cp results.json results.json

  # =========================
  # 5. Upload to AccuKnox SaaS
  # =========================
  - name: 'ubuntu'
    id: 'upload-accuknox'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        echo "Uploading results to AccuKnox SaaS..."

        curl --location --request POST "$(/bin/cat endpoint.txt)/api/v1/artifact/" \
          --header "Authorization: Bearer $(cat token.txt)" \
          --header "Label: $(cat label.txt)" \
          --form "file=@results.json"

  # =========================
  # 6. Fail on CRITICAL
  # =========================
  - name: 'ubuntu'
    id: 'gate'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if grep -q "CRITICAL" results.json; then
          echo "❌ CRITICAL vulnerabilities found - blocking build"
          exit 1
        fi

options:
  logging: CLOUD_LOGGING_ONLY
